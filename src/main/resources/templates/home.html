<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/app-layout}">
<head>
    <title>홈</title>
</head>
<body>
<div layout:fragment="content">
    <div class="hero min-h-[60vh] bg-base-200 rounded-lg">
        <div class="hero-content text-center">
            <div class="max-w-md">
                <h1 class="text-5xl font-bold">🎓 학사관리 시스템</h1>
                <p class="py-6">
                    JPA 학습을 위한 실습 프로젝트입니다.<br>
                    게시판, 강의 관리, 수강신청 기능을 제공합니다.
                </p>
                <div class="flex gap-4 justify-center">
                    <a href="/board" class="btn btn-primary">게시판</a>
                    <a href="/course" class="btn btn-secondary">강의</a>
                    <a href="/enrollment" class="btn btn-accent">수강신청</a>
                </div>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-12">
        <!-- 게시판 카드 -->
        <div class="card bg-base-100 shadow-xl">
            <div class="card-body">
                <h2 class="card-title">📝 게시판</h2>
                <p>자유롭게 글을 작성하고 공유하세요.</p>
                <div class="card-actions justify-end">
                    <a href="/board" class="btn btn-sm btn-primary">바로가기</a>
                </div>
                <div class="badge badge-outline mt-2">Query Methods</div>
            </div>
        </div>

        <!-- 강의 카드 -->
        <div class="card bg-base-100 shadow-xl">
            <div class="card-body">
                <h2 class="card-title">📚 강의</h2>
                <p>다양한 강의를 둘러보고 수강하세요.</p>
                <div class="card-actions justify-end">
                    <a href="/course" class="btn btn-sm btn-secondary">바로가기</a>
                </div>
                <div class="badge badge-outline mt-2">JPQL</div>
            </div>
        </div>

        <!-- 수강신청 카드 -->
        <div class="card bg-base-100 shadow-xl">
            <div class="card-body">
                <h2 class="card-title">✍️ 수강신청</h2>
                <p>원하는 강의를 신청하고 관리하세요.</p>
                <div class="card-actions justify-end">
                    <a href="/enrollment" class="btn btn-sm btn-accent">바로가기</a>
                </div>
                <div class="badge badge-outline mt-2">QueryDSL</div>
            </div>
        </div>
    </div>

    <div class="alert alert-info shadow-lg mt-12">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-current shrink-0 w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <div>
            <h3 class="font-bold">Step 1: ManyToOne 단방향</h3>
            <div class="text-xs">이 프로젝트는 ManyToOne 단방향 관계만 사용합니다. 양방향 관계는 Step 2에서 학습합니다.</div>
        </div>
    </div>
</div>
</body>
</html>
