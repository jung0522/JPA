<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/app-layout}">
<head>
    <title>게시글 작성</title>
</head>
<body>
<div layout:fragment="content">
    <h1 class="text-3xl font-bold mb-6" id="form-title">게시글 작성</h1>

    <div class="card bg-base-100 shadow-xl">
        <div class="card-body">
            <div class="form-control">
                <label class="label">
                    <span class="label-text">제목</span>
                </label>
                <input type="text" id="title" placeholder="제목을 입력하세요" class="input input-bordered" maxlength="200" />
            </div>

            <div class="form-control mt-4">
                <label class="label">
                    <span class="label-text">내용</span>
                </label>
                <textarea id="content" placeholder="내용을 입력하세요" class="textarea textarea-bordered h-64" maxlength="5000"></textarea>
            </div>

            <div class="card-actions justify-end mt-6">
                <a href="/board" class="btn btn-ghost">취소</a>
                <button onclick="submitBoard()" class="btn btn-primary">저장</button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
    const boardNo = [[${boardNo}]] || null;
    const isEditMode = boardNo !== null;

    // 수정 모드면 기존 데이터 로드
    if (isEditMode) {
        document.getElementById('form-title').textContent = '게시글 수정';
        loadBoardForEdit();
    }

    // 수정할 게시글 로드
    async function loadBoardForEdit() {
        if (!requireLogin()) return;

        try {
            const response = await fetch(`/api/boards/${boardNo}`, {
                credentials: 'include'
            });

            if (!response.ok) throw new Error('Failed to load board');

            const result = await response.json();
            const board = result.data;

            document.getElementById('title').value = board.title;
            document.getElementById('content').value = board.content;
        } catch (error) {
            console.error('Error loading board:', error);
            alert('게시글을 불러오는데 실패했습니다.');
            location.href = '/board';
        }
    }

    // 게시글 저장
    async function submitBoard() {
        if (!requireLogin()) return;

        const title = document.getElementById('title').value.trim();
        const content = document.getElementById('content').value.trim();

        if (!title) {
            alert('제목을 입력하세요.');
            return;
        }

        if (!content) {
            alert('내용을 입력하세요.');
            return;
        }

        try {
            const url = isEditMode ? `/api/boards/${boardNo}` : '/api/boards';
            const method = isEditMode ? 'PUT' : 'POST';

            const response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify({ title, content })
            });

            if (!response.ok) {
                const result = await response.json();
                alert(result.message || '저장 실패');
                return;
            }

            const result = await response.json();
            alert(isEditMode ? '수정되었습니다.' : '작성되었습니다.');
            location.href = `/board/${result.data.boardNo}`;
        } catch (error) {
            console.error('Error submitting board:', error);
            alert('저장 중 오류가 발생했습니다.');
        }
    }
    </script>
</div>
</body>
</html>
