<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/app-layout}">
<head>
    <title>로그인</title>
</head>
<body>
<div layout:fragment="content">
    <div class="flex items-center justify-center min-h-[60vh]">
        <div class="w-96 bg-white rounded-lg shadow-xl p-8">
            <h2 class="text-2xl font-bold text-center text-gray-900 mb-6">🎓 학사관리 로그인</h2>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">아이디</label>
                    <input type="text" id="username" placeholder="아이디를 입력하세요"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">비밀번호</label>
                    <input type="password" id="password" placeholder="비밀번호를 입력하세요"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" 
                           onkeypress="if(event.keyCode===13) login()" />
                </div>

                <button onclick="login()" 
                        class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition-colors font-medium">
                    로그인
                </button>
            </div>

            <div class="mt-6 pt-6 border-t border-gray-200">
                <h3 class="text-sm font-medium text-gray-700 text-center mb-3">테스트 계정</h3>
                <div class="text-sm space-y-1 text-gray-600">
                    <p><strong>관리자:</strong> admin / 1234</p>
                    <p><strong>강사:</strong> instructor01, instructor02 / 1234</p>
                    <p><strong>학생:</strong> student01, student02 / 1234</p>
                </div>
            </div>
        </div>
    </div>

    <script>
    async function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        if (!username || !password) {
            alert('아이디와 비밀번호를 입력하세요.');
            return;
        }

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            });

            const result = await response.json();

            if (response.ok) {
                // 세션 기반이므로 localStorage 저장 불필요
                // 서버가 자동으로 세션 생성 및 쿠키 발급
                alert('로그인 성공!');
                location.href = '/';
            } else {
                alert(result.message || '로그인 실패');
            }
        } catch (error) {
            console.error('Login error:', error);
            alert('로그인 중 오류가 발생했습니다.');
        }
    }
    </script>
</div>
</body>
</html>
