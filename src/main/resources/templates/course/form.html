<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/app-layout}">
<head>
    <title>강의 작성</title>
</head>
<body>
<div layout:fragment="content">
    <h1 class="text-3xl font-bold mb-6" id="form-title">강의 생성</h1>

    <div class="card bg-base-100 shadow-xl">
        <div class="card-body">
            <div class="form-control">
                <label class="label">
                    <span class="label-text">강의명</span>
                </label>
                <input type="text" id="name" placeholder="강의명을 입력하세요" class="input input-bordered" maxlength="200" />
            </div>

            <div class="form-control mt-4">
                <label class="label">
                    <span class="label-text">설명</span>
                </label>
                <textarea id="description" placeholder="강의 설명을 입력하세요" class="textarea textarea-bordered h-32" maxlength="2000"></textarea>
            </div>

            <div class="form-control mt-4">
                <label class="label">
                    <span class="label-text">최대 인원</span>
                </label>
                <input type="number" id="maxStudents" placeholder="최대 인원" class="input input-bordered" min="1" />
            </div>

            <div class="card-actions justify-end mt-6">
                <a href="/course" class="btn btn-ghost">취소</a>
                <button onclick="submitCourse()" class="btn btn-primary">저장</button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
    const courseNo = [[${courseNo}]] || null;
    const isEditMode = courseNo !== null;

    if (isEditMode) {
        document.getElementById('form-title').textContent = '강의 수정';
        loadCourseForEdit();
    }

    // 수정할 강의 로드
    async function loadCourseForEdit() {
        if (!requireLogin()) return;

        try {
            const token = getToken();
            const response = await fetch(`/api/courses/${courseNo}`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (!response.ok) throw new Error('Failed to load course');

            const result = await response.json();
            const course = result.data;

            document.getElementById('name').value = course.name;
            document.getElementById('description').value = course.description || '';
            document.getElementById('maxStudents').value = course.maxStudents;
        } catch (error) {
            console.error('Error loading course:', error);
            alert('강의를 불러오는데 실패했습니다.');
            location.href = '/course';
        }
    }

    // 강의 저장
    async function submitCourse() {
        if (!requireLogin()) return;

        const name = document.getElementById('name').value.trim();
        const description = document.getElementById('description').value.trim();
        const maxStudents = parseInt(document.getElementById('maxStudents').value);

        if (!name) {
            alert('강의명을 입력하세요.');
            return;
        }

        if (!maxStudents || maxStudents < 1) {
            alert('최대 인원을 1명 이상 입력하세요.');
            return;
        }

        try {
            const token = getToken();
            const url = isEditMode ? `/api/courses/${courseNo}` : '/api/courses';
            const method = isEditMode ? 'PUT' : 'POST';

            const response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ name, description, maxStudents })
            });

            if (!response.ok) {
                const result = await response.json();
                alert(result.message || '저장 실패');
                return;
            }

            const result = await response.json();
            alert(isEditMode ? '수정되었습니다.' : '생성되었습니다.');
            location.href = `/course/${result.data.courseNo}`;
        } catch (error) {
            console.error('Error submitting course:', error);
            alert('저장 중 오류가 발생했습니다.');
        }
    }
    </script>
</div>
</body>
</html>
