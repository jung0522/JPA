<!-- Header Fragment -->
<header th:fragment="header" class="bg-white shadow-lg border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
            <!-- 로고 -->
            <div class="flex items-center">
                <a href="/" class="text-2xl font-bold text-gray-900">🎓 학사관리</a>
            </div>
            
            <!-- 메인 메뉴 -->
            <nav class="hidden md:flex space-x-8">
                <a href="/board" class="text-gray-700 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">게시판</a>
                <a href="/course" class="text-gray-700 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">강의관리</a>
                <a href="/enrollment/manage" class="text-gray-700 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">수강신청관리</a>
            </nav>
            
            <!-- 사용자 영역 -->
            <div class="flex items-center space-x-4">
                <!-- 로그인 전 -->
                <div id="before-login">
                    <a href="/auth/login" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">로그인</a>
                </div>
                
                <!-- 로그인 후 -->
                <div id="after-login" class="hidden flex items-center space-x-4">
                    <!-- 학생용 내 수강신청 버튼 -->
                    <a href="/enrollment/me" id="my-enrollment-btn" class="hidden bg-gray-100 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-200 transition-colors">내 수강신청</a>
                    
                    <!-- 사용자 정보 -->
                    <div class="flex items-center space-x-2">
                        <span id="user-info" class="text-sm font-medium text-gray-700"></span>
                        <button onclick="logout()" class="text-gray-500 hover:text-gray-700 text-sm">로그아웃</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
