<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">학사관리 시스템 - 프로젝트 문서</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <a href="/project" class="text-2xl font-bold text-gray-900 hover:text-blue-600 transition">
                        🎓 학사관리 시스템
                    </a>
                </div>
                <nav class="hidden md:flex space-x-6">
                    <a href="/project" class="text-gray-700 hover:text-blue-600 font-medium transition">API 목록</a>
                    <a href="/" class="text-gray-700 hover:text-blue-600 font-medium transition">메인으로</a>
                    <a href="/guide" class="text-gray-700 hover:text-blue-600 font-medium transition">가이드</a>
                    <a href="/swagger-ui/index.html" target="_blank" class="text-gray-700 hover:text-blue-600 font-medium transition">Swagger UI ↗</a>
                </nav>
                <!-- Mobile Menu Button -->
                <button id="mobile-menu-btn" class="md:hidden text-gray-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>
            <!-- Mobile Menu -->
            <div id="mobile-menu" class="hidden md:hidden mt-4 space-y-2">
                <a href="/project" class="block text-gray-700 hover:text-blue-600 font-medium py-2">API 목록</a>
                <a href="/" class="block text-gray-700 hover:text-blue-600 font-medium py-2">메인으로</a>
                <a href="/guide" class="block text-gray-700 hover:text-blue-600 font-medium py-2">가이드</a>
                <a href="/swagger-ui/index.html" target="_blank" class="block text-gray-700 hover:text-blue-600 font-medium py-2">Swagger UI ↗</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main layout:fragment="content" class="max-w-7xl mx-auto px-4 py-8">
        <!-- Content will be inserted here -->
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-12">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="text-center text-gray-500 text-sm space-y-2">
                <p class="font-semibold">학사관리 시스템 - Step 1: ManyToOne 단방향</p>
                <p>Spring Boot 3.5.6 | JPA + Hibernate 6 | Query Methods, JPQL, QueryDSL</p>
            </div>
        </div>
    </footer>

    <!-- Mobile Menu Toggle Script -->
    <script>
        document.getElementById('mobile-menu-btn').addEventListener('click', function() {
            var menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        });
    </script>
</body>
</html>
