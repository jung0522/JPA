# DataSource Configuration (root user for initial setup)
spring.datasource.url=jdbc:mariadb://localhost:3307/mysql
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:init/create-database.sql
spring.sql.init.continue-on-error=false

# JPA Configuration (do not create tables)
spring.jpa.hibernate.ddl-auto=none
